<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fa" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AgentHub</title>
    <style>
      #agenthub-bootstrap-shell[hidden] {
        display: none;
      }

      #agenthub-bootstrap-shell {
        box-sizing: border-box;
        display: grid;
        align-content: start;
        min-height: 100vh;
        padding: clamp(28px, 8vw, 96px) clamp(20px, 7vw, 96px);
        color: #1b1d22;
        background: #f5f7fa;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }

      #agenthub-bootstrap-shell section {
        width: min(100%, 760px);
        padding: clamp(24px, 5vw, 48px);
        background: #fff;
        border: 1px solid #d9dce2;
        border-radius: 16px;
      }

      #agenthub-bootstrap-shell span {
        color: #626d7b;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.12em;
      }

      #agenthub-bootstrap-shell h1 {
        margin: 12px 0 8px;
        font-size: clamp(30px, 5vw, 48px);
        line-height: 1.1;
      }

      #agenthub-bootstrap-shell p {
        margin: 0;
        color: #5e626b;
        font-size: 15px;
        line-height: 1.6;
      }

      @media (prefers-color-scheme: dark) {
        #agenthub-bootstrap-shell {
          color: #f3f5f8;
          background: #101319;
        }

        #agenthub-bootstrap-shell section {
          background: #171b24;
          border-color: #2e3542;
        }

        #agenthub-bootstrap-shell span {
          color: #aeb8c7;
        }

        #agenthub-bootstrap-shell p {
          color: #c2c9d4;
        }
      }
    </style>
    <script defer src="/auth-preload.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
