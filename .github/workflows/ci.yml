name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm exec tsc --project tests/integration/tsconfig.json --pretty false
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Repeat visible dark diff token gates without retries
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: token-test-results/results.json
        run: >-
          pnpm exec playwright test --project=mobile-390 --grep '深色.*Diff'
          --repeat-each=3 --retries=0 --output=token-test-results --reporter=line,json
      - run: pnpm test:e2e
      - name: Preserve fixture browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fixture-browser-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
            token-test-results/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6

  real-service:
    name: Real service and visual evidence
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      # These tests create their own loopback server, PGlite database and ACP
      # fixture process. They never use a deployed NAS or a paid Agent account.
      AGENTHUB_E2E_LIVE: '0'
      AGENTHUB_VISUAL_OUTPUT: ${{ github.workspace }}/artifacts/real-service-visual
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:qa
      - run: pnpm exec playwright install --with-deps chromium
      - name: Prepare visual artifact parent directory
        run: mkdir -p "$(dirname "$AGENTHUB_VISUAL_OUTPUT")"
      - name: Verify current workflows and capture the complete visual matrix
        id: real-tests
        env:
          AGENTHUB_E2E_REAL_TMPDIR: ${{ runner.temp }}/agenthub-real-service
        run: >-
          pnpm exec playwright test --config=playwright.real.config.ts
          tests/e2e-real/workbench.spec.ts
          tests/e2e-real/workspace-content-visual.spec.ts
          tests/e2e-real/workspace-send-ownership.spec.ts
          tests/e2e-real/project-directory-picker.spec.ts
          tests/e2e-real/new-work-prompt.spec.ts
          tests/e2e-real/project-filters.spec.ts
          tests/e2e-real/project-state-truth.spec.ts
          tests/e2e-real/session-creation-ownership.spec.ts
          tests/e2e-real/project-work-empty.spec.ts
          tests/e2e-real/home-populated-visual.spec.ts
          tests/e2e-real/home-project-choice.spec.ts
          tests/e2e-real/task-creation-recovery.spec.ts
          tests/e2e-real/task-cancel-safety.spec.ts
          tests/e2e-real/manual-task-start.spec.ts
          tests/e2e-real/task-review.spec.ts
          tests/e2e-real/worktree-review.spec.ts
          tests/e2e-real/worktree-retry.spec.ts
          tests/e2e-real/worktree-queue.spec.ts
          tests/e2e-real/worktree-cancel.spec.ts
          tests/e2e-real/agent-defaults-management.spec.ts
          tests/e2e-real/agent-connection-check.spec.ts
          tests/e2e-real/agent-capability-truth.spec.ts
          tests/e2e-real/prompt-library-empty.spec.ts
          tests/e2e-real/prompt-version-ownership.spec.ts
          tests/e2e-real/settings-header-visual.spec.ts
          tests/e2e-real/settings-mobile-navigation.spec.ts
          tests/e2e-real/runtime-status-truth.spec.ts
          tests/e2e-real/v1-baseline.spec.ts
      - name: Check screenshot completeness, console errors and layout measurements
        if: ${{ !cancelled() && (steps.real-tests.outcome == 'success' || steps.real-tests.outcome == 'failure') }}
        run: >-
          pnpm qa:geometry
          "$AGENTHUB_VISUAL_OUTPUT/audit.json"
          "$AGENTHUB_VISUAL_OUTPUT/geometry.json"
      - name: Preserve isolated test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: real-service-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            real-playwright-report/
            real-test-results/
            artifacts/real-service-visual/*.png
            artifacts/real-service-visual/*.json
            artifacts/real-service-visual/SHA256SUMS
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6

  real-accessibility:
    name: Real accessibility matrix
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      # Isolated loopback/PGlite and local ACP fixture only. No NAS or paid Agent account.
      AGENTHUB_E2E_LIVE: '0'
      AGENTHUB_ACCESSIBILITY_OUTPUT: ${{ github.workspace }}/artifacts/real-accessibility/audit.json
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Scan 154 real page states with one report writer
        env:
          AGENTHUB_E2E_REAL_TMPDIR: ${{ runner.temp }}/agenthub-accessibility
        run: pnpm exec playwright test --config=playwright.real.config.ts --workers=1 tests/e2e-real/v1-accessibility.spec.ts
      - name: Preserve complete or partial accessibility evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: real-accessibility-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            real-playwright-report/
            real-test-results/
            artifacts/real-accessibility/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6

  postgres-runtime-ownership:
    name: Real PostgreSQL runtime ownership
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: agenthub-ci-disposable
          POSTGRES_DB: agenthub_runtime_ci
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d agenthub_runtime_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: mkdir -p artifacts
      - name: Verify real independent connections and ownership loss in a disposable database
        env:
          # Dedicated job service only; tests never consult DATABASE_URL or contact a deployed host.
          AGENTHUB_PG_OWNERSHIP_TEST: '1'
          AGENTHUB_PG_OWNERSHIP_TEST_URL: postgresql://postgres:agenthub-ci-disposable@127.0.0.1:${{ job.services.postgres.ports[5432] }}/agenthub_runtime_ci
        run: >-
          pnpm exec vitest run packages/db/src/runtime-ownership-postgres.integration.test.ts
          --reporter=default --reporter=json --outputFile=artifacts/postgres-runtime-ownership.json
      - name: Preserve exact-commit PostgreSQL results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: postgres-runtime-ownership-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/postgres-runtime-ownership.json
          if-no-files-found: warn
          retention-days: 7

  focused-interactions:
    name: Focused interaction evidence
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      # Same real loopback/PGlite/controlled ACP fixtures; no paid providers.
      AGENTHUB_E2E_LIVE: '0'
      PLAYWRIGHT_JSON_OUTPUT_NAME: focused-test-results/results.json
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify focused workflows without retries
        env:
          AGENTHUB_E2E_REAL_TMPDIR: ${{ runner.temp }}/agenthub-focused-interactions
        run: >-
          pnpm exec playwright test --config=playwright.real.config.ts
          tests/e2e-real/workspace-process-visual.spec.ts
          tests/e2e-real/session-rename.spec.ts
          tests/e2e-real/session-export.spec.ts
          tests/e2e-real/task-start-recovery.spec.ts
          tests/e2e-real/agent-availability.spec.ts
          --retries=0 --output=focused-test-results --reporter=line,json
      - name: Verify saved-task Prompt repair regression without retries
        env:
          AGENTHUB_E2E_REAL_TMPDIR: ${{ runner.temp }}/agenthub-prompt-repair
          PLAYWRIGHT_JSON_OUTPUT_NAME: prompt-repair-results/results.json
        run: >-
          pnpm exec playwright test --config=playwright.real.config.ts
          tests/e2e-real/new-work-prompt.spec.ts
          --grep '已保存任务缺变量后原地修复并启动'
          --retries=0 --output=prompt-repair-results --reporter=line,json
      - name: Preserve focused evidence before the larger matrix finishes
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: focused-interaction-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            focused-test-results/
            prompt-repair-results/
          if-no-files-found: warn
          retention-days: 7
